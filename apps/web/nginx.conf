# Nginx phuc vu SPA da build (dist/) va dong vai tro reverse-proxy duy nhat toi Gateway,
# giu dung nguyen tac "single-origin": trinh duyet chi bao gio goi ve MOT origin duy nhat.
# Ten host "gateway" la ten service trong infra/docker-compose.yml (Docker network DNS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 26/10/2026: nang gioi han body len 26MB - truoc day khong khai bao nen Nginx dung mac dinh 1MB,
    # moi lan tai tep > 1MB qua web (tai lieu, anh cham cong) bi 413 ngay tai Nginx, du
    # document-service cho phep toi 25MB (MAX_UPLOAD_SIZE_BYTES). Kiem thu truoc day goi thang
    # Gateway cong 3000 nen khong bat duoc. 26MB = 25MB tep + phan dau multipart.
    client_max_body_size 26m;

    # 22/07/2026: server_tokens off - phat hien qua code review toan du an: mac dinh Nginx tra
    # ve so phien ban chinh xac trong header "Server" cua MOI response (vd "nginx/1.27.0"), lo
    # thong tin khong can thiet giup ke tan cong khoanh vung nhanh cac lo hong CVE da biet theo
    # phien ban cu the.
    server_tokens off;

    # 22/07/2026: bo sung 3 security header con thieu - phat hien qua code review toan du an:
    # cac service NestJS phia sau da co helmet() (xem apps/gateway/src/main.ts) nhung Nginx dung
    # phia truoc phuc vu SPA lai khong co header nao tuong tu, nen response HTML/asset tinh cua
    # chinh SPA (khac voi response JSON tu API di qua /api/v1/) hoan toan khong duoc bao ve.
    # "always" de header van duoc gan ke ca voi response loi (4xx/5xx) cua Nginx.
    #   - X-Frame-Options: chan trang bi nhung vao <iframe> tu domain khac (chong clickjacking).
    #   - X-Content-Type-Options: chan trinh duyet tu doan (sniff) sai Content-Type khai bao.
    #   - Referrer-Policy: khong gui URL day du (co the chua token/id nhay cam trong query) sang
    #     origin khac khi nguoi dung bam link ra ngoai.
    # Content-Security-Policy CHUA bo sung o day - de xuat rieng, rui ro cao hon (de sai lech vi
    # Vite build co the dung inline style/script va SPA can ket noi WebSocket toi /ws/), can
    # kiem thu ky truoc khi bat trong production - xem bao cao code review.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # REST API -> Gateway
    location /api/v1/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Socket.IO) -> Gateway
    location /ws/ {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Static assets: cache aggressively (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched route serves index.html so React Router can take over
    location / {
        try_files $uri /index.html;
    }
}
