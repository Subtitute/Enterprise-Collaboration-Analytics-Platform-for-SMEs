# CI pipeline required by Doc/Technical_Spec.md §11:
#   1. Install dependencies (cached on package-lock.json).
#   2. Lint (ESLint) + type-check (`tsc --noEmit`).
#   3. Run unit tests across the whole workspace.
#   4. Build a Docker image per service (build-verification only — no registry push,
#      since the project has no staging environment to push to).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # Steps 1-3: install, lint + typecheck, unit test — one job, one npm install,
  # shared across the whole npm-workspaces monorepo (9 workspaces).
  lint-typecheck-test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root, all workspaces)
        run: npm ci

      - name: Lint (ESLint) — all workspaces
        run: npm run lint

      # 26/08/2026: sau dot rollout i18n va sau do 3 lan rieng phai tu tay tim thu chuoi tieng Viet
      # co dau con sot lai truc tiep trong ma nguon .ts/.tsx (DatePicker.tsx, RecentActivityFeed.tsx,
      # Topbar.tsx - ca 3 deu lo ra SAU KHI dot rollout i18n da duoc coi la "hoan tat"), toi them
      # buoc nay de CI tu bat loi nay ngay khi co PR moi, thay vi phai cho ra soat thu cong lan nua.
      - name: Lint — hardcoded Vietnamese strings outside i18n (apps/web)
        run: npm run lint:i18n-strings

      - name: Type-check (tsc --noEmit) — all workspaces
        run: npm run typecheck

      # 22/08/2026: doi sang `test:coverage` (chay `--coverage` cho moi workspace) - 8 service
      # backend + 3 package dung chung da co `coverageThreshold` rieng trong package.json (dat theo
      # so lieu coverage thuc te da do, lam san chan chong tut coverage, khong phai muc tieu ly
      # tuong) nen buoc nay se lam CI DO neu coverage giam duoi nguong. `apps/web` chi bao cao so
      # lieu (khong dat threshold - xem ly do trong vite.config.ts) nen khong the lam buoc nay do.
      - name: Unit tests — all workspaces (with coverage; backend enforces coverageThreshold)
        run: npm run test:coverage

  # 26/10/2026: pytest cho apps/ml-service (Technical_Spec.md muc 27.12 GD 5) - truoc day CI khong
  # chay test Python nao. Model ONNX tai theo commit/SHA256 da ghim giong apps/ml-service/Dockerfile,
  # co cache; test tich hop dung Postgres that (service container cung cong 5440 nhu postgres-ml cua
  # docker compose). MinIO duoc thay bang ban gia trong tests/conftest.py.
  # Anh mau: anh to bay STS-130 cua NASA (pham vi cong cong, Wikimedia Commons) - KHONG dung
  # largest_selfie.jpg cua opencv_zoo vi do la anh dau ra cua YuNet (mat da bi ve khung/diem moc).
  ml-service-test:
    name: ml-service pytest
    runs-on: ubuntu-latest
    services:
      postgres-ml:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ml_db
          POSTGRES_USER: ml_user
          POSTGRES_PASSWORD: ml_password
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U ml_user -d ml_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ml-service/requirements*.txt

      - name: Cache ONNX models + sample image
        id: face-models
        uses: actions/cache@v4
        with:
          path: apps/ml-service/models
          key: ml-face-models-yunet-48b10fa-arcface-c5cae0f-crew-7321cb1

      - name: Download ONNX models + sample image (pinned commit + SHA256, mirror Dockerfile)
        if: steps.face-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fL -o models/face_detection_yunet.onnx "https://media.githubusercontent.com/media/opencv/opencv_zoo/48b10fa505aeb51fbd127fc60a5c660040e823b7/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          curl -fL -o models/arcface_resnet100.onnx "https://media.githubusercontent.com/media/onnx/models/c5cae0f1942c8d7727372c7b1f6b485aa39e4421/validated/vision/body_analysis/arcface/model/arcfaceresnet100-8.onnx"
          curl -fL -A "ECAP-CI/1.0 (graduation project test fixture)" -o models/sample_crew_for_tests.jpg "https://upload.wikimedia.org/wikipedia/commons/4/4b/STS-130_Official_Crew_Photo.jpg"
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  models/face_detection_yunet.onnx" | sha256sum -c -
          echo "f3a6bc281e72f88862f5748b53be3d76b3b48f8f1ab1f4a537941bdc4e1b01da  models/arcface_resnet100.onnx" | sha256sum -c -
          echo "7321cb1afaa4140569e27bf99f602140cd78791bb1c2ef7ffe4367517e8c796b  models/sample_crew_for_tests.jpg" | sha256sum -c -

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        env:
          DB_HOST: localhost
          DB_PORT: "5440"
        run: python -m pytest -q

  # Step 4: build-verification only for the 7 service Docker images. Runs after the
  # job above so we don't burn CI time building images for a change that fails
  # lint/typecheck/tests. No `docker push` anywhere — see Technical_Spec.md §11.
  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - iam-service
          - project-task-service
          - document-service
          - notification-service
          - analytics-service
          - crm-service
          - hrm-service
          - web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo ROOT, not apps/<service>/ — every service
          # Dockerfile needs access to packages/common-dto and packages/common-guard
          # (npm workspaces), see the header comment in apps/iam-service/Dockerfile
          # (the reference template all the other service Dockerfiles copy).
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: ecap/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
