# CI pipeline required by Doc/Technical_Spec.md §11:
#   1. Install dependencies (cached on package-lock.json).
#   2. Lint (ESLint) + type-check (`tsc --noEmit`).
#   3. Run unit tests across the whole workspace.
#   4. Build a Docker image per service (build-verification only — no registry push,
#      since the project has no staging environment to push to).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # Steps 1-3: install, lint + typecheck, unit test — one job, one npm install,
  # shared across the whole npm-workspaces monorepo (9 workspaces).
  lint-typecheck-test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root, all workspaces)
        run: npm ci

      - name: Lint (ESLint) — all workspaces
        run: npm run lint

      - name: Type-check (tsc --noEmit) — all workspaces
        run: npm run typecheck

      - name: Unit tests — all workspaces
        run: npm test

  # Step 4: build-verification only for the 7 service Docker images. Runs after the
  # job above so we don't burn CI time building images for a change that fails
  # lint/typecheck/tests. No `docker push` anywhere — see Technical_Spec.md §11.
  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - iam-service
          - project-task-service
          - document-service
          - notification-service
          - analytics-service
          - crm-service
          - hrm-service
          - web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo ROOT, not apps/<service>/ — every service
          # Dockerfile needs access to packages/common-dto and packages/common-guard
          # (npm workspaces), see the header comment in apps/iam-service/Dockerfile
          # (the reference template all the other service Dockerfiles copy).
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: ecap/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
