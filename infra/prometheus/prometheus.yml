# 04/08/2026: cau hinh scrape Prometheus - Technical_Spec.md muc 15. Moi target la 1 trong 7
# service Node (endpoint /metrics, danh dau @Public() - xem packages/common-metrics) hoac
# kafka-exporter (metric lag consumer group). Tat ca deu nam trong internal-net nen Prometheus
# goi thang qua ten service, khong can qua Gateway.
global:
  scrape_interval: 15s
  # 22/08/2026: khai bao tuong minh (mac dinh cua Prometheus la 1m BAT KE scrape_interval neu
  # khong dat rieng) - khop voi scrape_interval de luat "for: 1m" (alert-rules.yml) danh gia du
  # nhanh/kip thoi, khong bi tre them toi 1 phut chi vi chu ky danh gia rieng cham hon chu ky scrape.
  evaluation_interval: 15s

# 22/08/2026: bo sung canh bao chu dong - xem alert-rules.yml (4 luat) va
# ../alertmanager/alertmanager.yml (dinh tuyen, chua co kenh thong bao that - xem README).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gateway
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['gateway:3000']

  - job_name: iam-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['iam-service:3001']

  - job_name: project-task-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['project-task-service:3002']

  - job_name: document-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['document-service:3003']

  - job_name: notification-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['notification-service:3004']

  - job_name: analytics-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['analytics-service:3005']

  # 04/08/2026: CRM-lite Service (them sau khi service duoc tao o Phase 2 - Technical_Spec.md muc 16).
  - job_name: crm-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['crm-service:3007']

  # 05/08/2026: HRM-lite Service (them sau khi service duoc tao o Phase 3 - Technical_Spec.md muc 17).
  - job_name: hrm-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['hrm-service:3006']

  # 15/10/2026: Inventory Service (Danh muc san pham + Kho - Technical_Spec.md muc 22).
  - job_name: inventory-service
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['inventory-service:3010']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']