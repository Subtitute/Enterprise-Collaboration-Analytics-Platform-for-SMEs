# 2026-07-18: Khoi tao docker-compose cho toan bo nen tang, theo Technical_Spec.md muc 8.
# Chay tu thu muc infra/:  docker compose --env-file .env up -d --build
name: ecap-sme

networks:
  internal-net:
    driver: bridge

volumes:
  postgres-iam-data:
  postgres-pt-data:
  postgres-doc-data:
  postgres-crm-data:
  postgres-hrm-data:
  timescale-data:
  mongo-data:
  kafka-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  # ---------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------
  postgres-iam:
    image: postgres:16-alpine
    container_name: postgres-iam
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_IAM_DB}
      POSTGRES_USER: ${POSTGRES_IAM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_IAM_PASSWORD}
    volumes:
      - postgres-iam-data:/var/lib/postgresql/data
    # 25/08/2026: fix ra soat bao mat - cong host cua toan bo tang du lieu/quan sat (5 Postgres +
    # TimescaleDB + MongoDB + Redis + Kafka + Prometheus + Alertmanager + Grafana) truoc day mo ra
    # TOAN BO mang (cu phap "HOST:CONTAINER" tran, Docker tu binding 0.0.0.0) du comment trong file
    # nay tu lau da noi ro y dinh la CHI de debug/xem tu chinh may host (vd dong 621-622 cu, ban
    # goc "khong phai thiet ke cho moi truong co the truy cap tu ben ngoai"). Gioi han ve 127.0.0.1
    # cho DUNG voi cau chu dinh do - van dung binh thuong tu may host (vd `psql -h localhost -p
    # 5433`), chi khong con lo ra mang neu may nay tung dat tren 1 mang co the dinh tuyen duoc
    # (VD/cloud demo) ma khong co firewall. KHONG ap dung cho `web`/`gateway` (thiet ke de truy cap
    # tu ben ngoai) hay cong S3 API cua MinIO (9010 - trinh duyet/dien thoai that su can goi thang
    # qua LAN/Cloudflare Tunnel de tai presigned URL, xem MINIO_PUBLIC_ENDPOINT).
    ports:
      - "127.0.0.1:5433:5432"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_IAM_USER} -d ${POSTGRES_IAM_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-pt:
    image: postgres:16-alpine
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10" ]
    container_name: postgres-pt
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PT_DB}
      POSTGRES_USER: ${POSTGRES_PT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PT_PASSWORD}
    volumes:
      - postgres-pt-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_PT_USER} -d ${POSTGRES_PT_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-doc:
    image: postgres:16-alpine
    container_name: postgres-doc
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DOC_DB}
      POSTGRES_USER: ${POSTGRES_DOC_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DOC_PASSWORD}
    volumes:
      - postgres-doc-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_DOC_USER} -d ${POSTGRES_DOC_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 04/08/2026: Postgres rieng cho CRM-lite Service (Technical_Spec.md muc 16) - dung quy uoc
  # database-per-service nhu 3 Postgres nghiep vu hien co.
  postgres-crm:
    image: postgres:16-alpine
    container_name: postgres-crm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_CRM_DB}
      POSTGRES_USER: ${POSTGRES_CRM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CRM_PASSWORD}
    volumes:
      - postgres-crm-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5438:5432"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_CRM_USER} -d ${POSTGRES_CRM_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 05/08/2026: Postgres rieng cho HRM-lite Service (Technical_Spec.md muc 17) - dung quy uoc
  # database-per-service nhu cac Postgres nghiep vu hien co.
  postgres-hrm:
    image: postgres:16-alpine
    container_name: postgres-hrm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_HRM_DB}
      POSTGRES_USER: ${POSTGRES_HRM_USER}
      POSTGRES_PASSWORD: ${POSTGRES_HRM_PASSWORD}
    volumes:
      - postgres-hrm-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5439:5432"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_HRM_USER} -d ${POSTGRES_HRM_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  timescaledb:
    # 22/08/2026: pin theo digest (thay vi tag "latest-pg16" troi) - phat hien qua audit ha tang:
    # tag troi nghia la build lai vai thang sau co the am tham keo ban khac voi ban da kiem thu.
    # Digest = dung chinh xac ban image dang chay/da kiem thu hom nay, khong bao gio doi y nghia.
    image: timescale/timescaledb:latest-pg16@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TIMESCALE_DB}
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescale-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5436:5432"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TIMESCALE_USER} -d ${TIMESCALE_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks: [ internal-net ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redis-data:/data
    # Host port 6380 (khong phai 6379 mac dinh) - may host da co Redis khac dang chay o 6379
    # (du an rieng cua nguoi dung). Giao tiep NOI BO giua cac container van dung dung cong
    # 6379 qua ten service "redis" (khong bi anh huong boi viec doi cong host o day).
    ports:
      - "127.0.0.1:6380:6379"
    networks: [ internal-net ]
    healthcheck:
      # $$ (shell-expand trong container) khong hoat dong vi container KHONG co bien moi
      # truong REDIS_PASSWORD (chi duoc truyen qua `command:` o tren) - dung $ don de
      # docker compose thay the truc tiep gia tri that tu .env luc parse file nay.
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 22/08/2026: pin theo digest - mirror ly do o timescaledb (tranh tag "latest" troi).
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # Host port 9010/9011 (khong phai 9000/9001 mac dinh) - may host da co MinIO khac dang
    # chay o do (du an rieng cua nguoi dung). Giao tiep NOI BO van dung dung cong 9000/9001.
    # 25/08/2026: fix ra soat bao mat - cong 9011 (console quan tri MinIO, dang nhap bang
    # MINIO_ROOT_USER/PASSWORD) truoc day mo ra TOAN BO mang (0.0.0.0), khac han quyet dinh co chu
    # dich o cac service khac trong file nay (chi web/gateway duoc expose ra host, moi noi khac ghi
    # ro ly do). Khong co ung dung nao trong he thong goi toi cong nay - chi con nguoi dung thu cong
    # can, va chi tu chinh may host. Gioi han ve 127.0.0.1 - van dung duoc tu may host, khong con lo
    # ra mang ngoai. Cong 9010 (S3 API) GIU NGUYEN mo toan mang vi trinh duyet/app di dong thuc su
    # can goi truc tiep de tai file qua presigned URL (xem MINIO_PUBLIC_ENDPOINT ben duoi).
    ports:
      - "9010:9000"
      - "127.0.0.1:9011:9001"
    command: server /data --console-address ":9001"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tao bucket MinIO mac dinh khi khoi dong (chay 1 lan roi thoat)
  minio-init:
    # 22/08/2026: pin theo digest - mirror ly do o timescaledb.
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [ internal-net ]
    # (Sua 21/07/2026) Bo lenh "mc anonymous set download" - bucket MinIO PHAI o che do private
    # (mac dinh khi tao khong khai bao policy). Moi truy cap tai file bat buoc di qua presigned URL
    # do Document Service cap sau khi xac thuc organizationId (xem Technical_Spec.md muc 3.4/8).
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb -p local/${MINIO_BUCKET}; mc mb -p local/${MINIO_HRM_BUCKET}; exit 0; "

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [ internal-net ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    healthcheck:
      # KRaft mode (khong Zookeeper): dung CLI co san trong image apache/kafka de kiem tra
      # broker da san sang nhan request tren listener noi bo (localhost:9092 = PLAINTEXT_HOST).
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------
  # Core Platform - Microservices
  # ---------------------------------------------------------------
  iam-service:
    build:
      context: ..
      dockerfile: apps/iam-service/Dockerfile
    container_name: iam-service
    restart: unless-stopped
    depends_on:
      postgres-iam: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # 25/07/2026: khai bao phu thuoc Redis (dung cho token-blacklist) - truoc day thieu, gay
      # race luc khoi dong lanh khi iam-service goi Redis truoc khi Redis healthy. Bo sung de
      # phong thu theo lop (defense-in-depth) du code da co try/catch fail-open cho Redis.
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres-iam
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_IAM_DB}
      DB_USER: ${POSTGRES_IAM_USER}
      DB_PASSWORD: ${POSTGRES_IAM_PASSWORD}
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    # ports: ["3001:3001"]  # go bo 21/07/2026 - khong expose ra host, chi Gateway/noi bo moi
    # goi duoc qua internal-net, tranh bypass Gateway/JWT/rate-limit (xem Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    depends_on:
      iam-service: { condition: service_healthy }
      project-task-service: { condition: service_healthy }
      document-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }
      crm-service: { condition: service_healthy }
      hrm-service: { condition: service_healthy }
      # 25/07/2026: kiem tra vong 2 phat hien - gateway dung REDIS_HOST/PORT ben duoi (rate-limit,
      # blacklist token) nhung truoc day khong khai bao phu thuoc "redis" nen co the khoi dong
      # truoc khi Redis san sang, gay loi tam thoi luc "docker compose up" lan dau.
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      IAM_SERVICE_URL: http://iam-service:3001
      PROJECT_TASK_SERVICE_URL: http://project-task-service:3002
      DOCUMENT_SERVICE_URL: http://document-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      CRM_SERVICE_URL: http://crm-service:3007
      HRM_SERVICE_URL: http://hrm-service:3006
    ports:
      - "3000:3000"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  project-task-service:
    build:
      context: ..
      dockerfile: apps/project-task-service/Dockerfile
    container_name: project-task-service
    restart: unless-stopped
    depends_on:
      postgres-pt: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres-pt
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_PT_DB}
      DB_USER: ${POSTGRES_PT_USER}
      DB_PASSWORD: ${POSTGRES_PT_PASSWORD}
      KAFKA_BROKER: kafka:29092
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      ENABLE_OUTBOX_POLLING: ${ENABLE_OUTBOX_POLLING:-true}
    # ports: ["3002:3002"]  # go bo 21/07/2026 - khong expose ra host, chi Gateway/noi bo moi
    # goi duoc qua internal-net, tranh bypass Gateway/JWT/rate-limit (xem Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3002/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  document-service:
    build:
      context: ..
      dockerfile: apps/document-service/Dockerfile
    container_name: document-service
    restart: unless-stopped
    depends_on:
      postgres-doc: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      # 25/07/2026: cho minio-init chay xong (tao bucket) truoc khi Document Service khoi dong -
      # minio "healthy" chi nghia la server MinIO da san sang, KHONG dam bao bucket da ton tai,
      # tranh loi NoSuchBucket khi upload file dau tien luc "docker compose up" lan dau.
      minio-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: postgres-doc
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DOC_DB}
      DB_USER: ${POSTGRES_DOC_USER}
      DB_PASSWORD: ${POSTGRES_DOC_PASSWORD}
      KAFKA_BROKER: kafka:29092
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # 21/07/2026: rieng cho viec KY presigned download URL - phai la host:port ma trinh
      # duyet cua client phan giai duoc (host mapping cua container minio la 9010, xem muc 8),
      # khac voi "minio:9000" o tren (chi dung noi bo giua cac container). Neu khong tach rieng,
      # link tai file bi hong vi trinh duyet khong resolve duoc hostname "minio".
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9010}
      # 25/08/2026: fix ra soat bao mat - truoc day gia tri nay bi HARDCODE "false" (khong giong 2
      # bien MINIO_PUBLIC_* ngay ben tren, von dung dang co the ghi de qua .env) du code ung dung
      # (configuration.ts) da ho tro doc tu env - khien nguoi van hanh KHONG THE bat HTTPS cho
      # presigned URL (URL nay la 1 bearer credential 15 phut, ca URL lan noi dung file deu di qua
      # HTTP thuan neu khong sua) ma khong sua tay file nay. Doi sang co the ghi de, mac dinh VAN LA
      # false (khong doi hanh vi hien tai) - bat len that qua .env can them 1 reverse proxy TLS
      # truoc MinIO hoac bat TLS native cua MinIO, ngoai pham vi sua doi nay.
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    # ports: ["3003:3003"]  # go bo 21/07/2026 - khong expose ra host, chi Gateway/noi bo moi
    # goi duoc qua internal-net, tranh bypass Gateway/JWT/rate-limit (xem Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3003/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  notification-service:
    build:
      context: ..
      dockerfile: apps/notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # 26/08/2026: fix ra soat - notification-service da dung Redis tu 25/08/2026
      # (RedisService.isUserBlacklisted(), kiem tra tai khoan bi deactivate truoc khi cho ket noi
      # WebSocket - xem apps/notification-service/src/redis/redis.service.ts) nhung truoc day
      # THIEU khai bao phu thuoc "redis" o day, khac voi iam-service/gateway/analytics-service da
      # co tu 25/07/2026 (xem 3 chu thich tuong ung ben tren/duoi) - phong thu theo lop (defense-
      # in-depth, du code da co try/catch fail-open cho Redis) chong race luc "docker compose up"
      # lan dau khi notification-service khoi dong truoc khi Redis san sang.
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3004
      # 26/08/2026 (fix audit - Major): doi tu 1 bien MONGO_URI ghep san bang noi chuoi truc tiep
      # (`mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/...`)
      # sang 5 bien RIENG LE, dong bo mau Postgres cua cac service khac trong file nay (vd DB_HOST/
      # DB_PORT/DB_USER/DB_PASSWORD/DB_NAME) - noi chuoi truc tiep KHONG encode khien 1 mat khau
      # chua ky tu dac biet co y nghia cu phap URI (@ : / ? # [ ] %) pha vo ket noi (vd dau '@'
      # trong mat khau bi nham la ranh gioi ket thuc credentials). configuration.ts (notification-
      # service) gio tu xay dung URI tu 5 bien nay va encodeURIComponent() rieng MONGO_USER/
      # MONGO_PASSWORD truoc khi noi chuoi. MONGO_INITDB_ROOT_USERNAME/PASSWORD/MONGO_DATABASE VAN
      # GIU NGUYEN (dung chung cho ca env cua chinh container `mongodb` o tren LAN scripts/backup.js,
      # restore.js) - chi doi CACH TRUYEN sang notification-service, khong doi ten/gia tri bien goc.
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    # ports: ["3004:3004"]  # go bo 21/07/2026 - khong expose ra host, chi Gateway/noi bo moi
    # goi duoc qua internal-net, tranh bypass Gateway/JWT/rate-limit (xem Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3004/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  analytics-service:
    build:
      context: ..
      dockerfile: apps/analytics-service/Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    depends_on:
      timescaledb: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # 25/07/2026: kiem tra vong 2 phat hien - cung mot lo hong nhu gateway (xem chu thich tren
      # gateway), analytics-service cung dung REDIS_HOST/PORT (cache tong hop analytics) nhung
      # khong khai bao phu thuoc "redis".
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${TIMESCALE_DB}
      DB_USER: ${TIMESCALE_USER}
      DB_PASSWORD: ${TIMESCALE_PASSWORD}
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      # 28/07/2026: tinh nang "Nhan xet AI" (GET /analytics/ai-insights) - xem infra/.env.example
      # de biet cach lay GEMINI_API_KEY mien phi. De trong van chay duoc, chi tinh nang nay tra loi
      # loi ro rang (503) thay vi lam sap ca service.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # 20/08/2026: phuong an du phong TU DONG khi Gemini loi/qua tai (Technical_Spec.md muc cung
      # ngay) - de trong nghia la KHONG co du phong (van chay binh thuong, chi mat lop du phong).
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    # ports: ["3005:3005"]  # go bo 21/07/2026 - khong expose ra host, chi Gateway/noi bo moi
    # goi duoc qua internal-net, tranh bypass Gateway/JWT/rate-limit (xem Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3005/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  crm-service:
    build:
      context: ..
      dockerfile: apps/crm-service/Dockerfile
    container_name: crm-service
    restart: unless-stopped
    depends_on:
      postgres-crm: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3007
      DB_HOST: postgres-crm
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_CRM_DB}
      DB_USER: ${POSTGRES_CRM_USER}
      DB_PASSWORD: ${POSTGRES_CRM_PASSWORD}
      KAFKA_BROKER: kafka:29092
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
    # Khong map port ra host, chi Gateway/noi bo moi goi duoc qua internal-net - cung quy uoc
    # voi 5 service nghiep vu con lai (Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3007/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  hrm-service:
    build:
      context: ..
      dockerfile: apps/hrm-service/Dockerfile
    container_name: hrm-service
    restart: unless-stopped
    depends_on:
      postgres-hrm: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      # 05/08/2026: cho minio-init chay xong (tao bucket hrm-attendance) truoc khi HRM-lite Service
      # khoi dong - mirror document-service (tranh loi NoSuchBucket khi check-in lan dau).
      minio-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_HOST: postgres-hrm
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_HRM_DB}
      DB_USER: ${POSTGRES_HRM_USER}
      DB_PASSWORD: ${POSTGRES_HRM_PASSWORD}
      KAFKA_BROKER: kafka:29092
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_HRM_BUCKET}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9010}
      # 25/08/2026: fix ra soat bao mat - truoc day gia tri nay bi HARDCODE "false" (khong giong 2
      # bien MINIO_PUBLIC_* ngay ben tren, von dung dang co the ghi de qua .env) du code ung dung
      # (configuration.ts) da ho tro doc tu env - khien nguoi van hanh KHONG THE bat HTTPS cho
      # presigned URL (URL nay la 1 bearer credential 15 phut, ca URL lan noi dung file deu di qua
      # HTTP thuan neu khong sua) ma khong sua tay file nay. Doi sang co the ghi de, mac dinh VAN LA
      # false (khong doi hanh vi hien tai) - bat len that qua .env can them 1 reverse proxy TLS
      # truoc MinIO hoac bat TLS native cua MinIO, ngoai pham vi sua doi nay.
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET}
      # 13/08/2026: toa do van phong cho co "on-site"/"off-site" (Technical_Spec.md muc 17) - de
      # trong (khong dat OFFICE_LATITUDE/OFFICE_LONGITUDE trong .env) nghia la TAT tinh nang nay
      # hoan toan (khong tinh toan, khong loi) - dien toa do that vao .env khi co van phong that.
      OFFICE_LATITUDE: ${OFFICE_LATITUDE:-}
      OFFICE_LONGITUDE: ${OFFICE_LONGITUDE:-}
      OFFICE_GEOFENCE_RADIUS_METERS: ${OFFICE_GEOFENCE_RADIUS_METERS:-200}
    # Khong map port ra host, chi Gateway/noi bo moi goi duoc qua internal-net - cung quy uoc
    # voi cac service nghiep vu con lai (Technical_Spec.md muc 8).
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3006/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_NOTIFICATION_URL: /ws/notifications
        VITE_WS_ANALYTICS_URL: /ws/analytics
    container_name: web
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - "80:80"
    networks: [ internal-net ]
    healthcheck:
      # 21/07/2026: dung 127.0.0.1 thay vi "localhost" - nginx (custom nginx.conf) chi listen
      # IPv4 (0.0.0.0:80, khong co "listen [::]:80"), trong khi wget/musl libc trong Alpine
      # uu tien resolve "localhost" ra ::1 (IPv6) truoc, gay ECONNREFUSED du app hoan toan binh thuong.
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------
  # Observability (bo sung 04/08/2026, Technical_Spec.md muc 15) - hoan toan tach biet khoi
  # Analytics Dashboard nghiep vu (React) o tren: cac container duoi day chi phuc vu so lieu
  # HA TANG/VAN HANH (latency, ty le loi HTTP, Kafka consumer lag), khong dung chung du lieu/
  # muc dich voi KPI nghiep vu. Khong service nao trong Core Platform phu thuoc (depends_on)
  # nhom nay - mat Prometheus/Grafana khong lam gian doan he thong nghiep vu.
  # ---------------------------------------------------------------
  prometheus:
    # 22/08/2026: pin theo digest - mirror ly do o timescaledb.
    image: prom/prometheus:latest@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    # Map ra host de xem truc tiep http://localhost:9090 (debug/demo cuc bo) - khong phai
    # thiet ke cho moi truong co the truy cap tu ben ngoai (giong cac container ha tang khac).
    ports:
      - "127.0.0.1:9090:9090"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 22/08/2026: nhan canh bao tu Prometheus (xem prometheus/alert-rules.yml) va dinh tuyen theo
  # alertmanager/alertmanager.yml - xem chu thich dau file do ve pham vi (chua co kenh thong bao
  # that). Map port ra host CHI de xem giao dien web debug/demo cuc bo, cung quy uoc voi Prometheus/
  # Grafana ben tren.
  alertmanager:
    image: prom/alertmanager:latest@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9095:9093"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Xuat metric Kafka (lag theo consumer group/topic) de Prometheus scrape - tu dong hoa lai
  # phan "kiem tra lag Kafka" truoc day phai lam thu cong o dot "ultimate check" (Technical_Spec.md,
  # muc 2026-07-28). Image build tu scratch (khong co shell/wget ben trong) nen KHONG khai bao
  # healthcheck - Prometheus tu retry scrape, khong service nao khac phu thuoc container nay.
  kafka-exporter:
    # 22/08/2026: pin theo digest - mirror ly do o timescaledb.
    image: danielqsj/kafka-exporter:latest@sha256:a51b280b55a763deaa1bc5024310bc2954995d9160014d7445055dac6a090868
    container_name: kafka-exporter
    restart: unless-stopped
    command: [ "--kafka.server=kafka:29092" ]
    depends_on:
      kafka: { condition: service_healthy }
    networks: [ internal-net ]

  grafana:
    # 22/08/2026: pin theo digest - mirror ly do o timescaledb.
    image: grafana/grafana:latest@sha256:1c1bd67c54c5fcf6e759897852b5a584191bd6796e8d328a5ace457799801261
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      # Dev only - doi gia tri that qua GRAFANA_ADMIN_PASSWORD trong infra/.env truoc khi dung
      # ngoai moi truong dev (cung quy uoc voi JWT_ACCESS_SECRET/INTERNAL_SHARED_SECRET).
      # 25/08/2026: fix ra soat bao mat - gia tri du phong khi bien moi truong chua duoc dat truoc
      # day la "admin" (trung mat khau mac dinh CHUAN cua chinh Grafana, dich quet tu dong dau
      # tien) - doi dong bo voi gia tri vi du moi trong .env.example (xem ghi chu tai do).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_admin_password}
      # Tat tinh nang dang ky/anonymous - chi 1 tai khoan admin duy nhat cho muc dich demo do an.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3010:3000"
    networks: [ internal-net ]
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      kafka: { condition: service_healthy }
      postgres-pt: { condition: service_healthy }
    networks: [ internal-net ]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/connectors" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
